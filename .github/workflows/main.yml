name: Build and Test VirtuCam

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python numpy pillow pygame

    - name: Verify Python imports
      run: |
        python -c "import cv2; import numpy; import pygame; import PIL"
        echo "All dependencies imported successfully!"

    - name: List files
      run: ls -la

    - name: Test script execution
      run: |
        if [ -f "main.py" ]; then
          python main.py --help || echo "Script executed (may have exited normally)"
        else
          echo "main.py not found, checking for other entry points"
          find . -name "*.py" | head -5
        fi
